<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Polish Vocabulary</title>
<style>
  :root {
    --bg-1: #667eea;
    --bg-2: #764ba2;
    --card: #ffffff;
    --text: #2d2a3d;
    --muted: #8a869c;
    --accent: #667eea;
    --good: #2ecc71;
    --bad: #e74c3c;
    --shadow: 0 20px 60px rgba(30, 20, 60, 0.25);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
    color: var(--text);
    padding-bottom: 60px;
  }

  .shell {
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 16px;
  }

  header { text-align: center; margin-bottom: 18px; }
  header h1 { color: #fff; margin: 0 0 4px; font-size: 28px; }
  header p { color: rgba(255,255,255,0.85); margin: 0; font-size: 14px; }

  .levels {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .levels button {
    border: none;
    padding: 8px 16px;
    border-radius: 999px;
    font-weight: 700;
    cursor: pointer;
    font-size: 13px;
    background: rgba(255,255,255,0.22);
    color: #fff;
    transition: background 0.15s, transform 0.1s;
  }
  .levels button.active { background: #fff; color: var(--accent); }
  .levels button:hover { transform: translateY(-1px); }

  .tabs {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }
  .tabs button {
    border: none;
    padding: 10px 18px;
    border-radius: 999px;
    font-weight: 700;
    cursor: pointer;
    font-size: 14px;
    background: rgba(255,255,255,0.22);
    color: #fff;
    transition: background 0.15s;
  }
  .tabs button.active { background: #fff; color: var(--accent); }

  .panel { display: none; }
  .panel.active { display: block; }

  .card-board { display: flex; flex-direction: column; align-items: center; }
  .counter { color: rgba(255,255,255,0.9); font-size: 13px; margin-bottom: 12px; }
  .card-wrap { perspective: 1200px; width: 100%; max-width: 420px; height: 260px; cursor: pointer; }
  .card { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4,0.2,0.2,1); }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; border-radius: 20px; background: var(--card);
    box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 24px; backface-visibility: hidden;
    -webkit-backface-visibility: hidden; text-align: center;
  }
  .face.back { transform: rotateY(180deg); }
  .word { font-size: 40px; font-weight: 800; margin: 8px 0; word-break: break-word; }
  .hint { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
  .badge {
    display: inline-block; padding: 5px 14px; border-radius: 999px; font-size: 12px; font-weight: 700;
    letter-spacing: 0.5px; color: #fff; text-transform: uppercase; margin-bottom: 6px;
  }
  .trans { font-size: 22px; font-weight: 600; line-height: 1.5; }
  .trans .lang { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 2px; }

  .searchbar { text-align: center; margin-bottom: 16px; }
  .searchbar input {
    padding: 12px 16px; border: none; border-radius: 999px; font-size: 15px; width: 260px;
    outline: none; box-shadow: 0 6px 20px rgba(0,0,0,0.15);
  }

  .row-actions { display: flex; gap: 12px; justify-content: center; margin-top: 22px; }
  button.pill {
    border: none; padding: 12px 18px; border-radius: 999px; font-size: 14px; font-weight: 700;
    cursor: pointer; background: #fff; color: var(--text); box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  button.pill:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(0,0,0,0.2); }

  .block { background: var(--card); border-radius: 16px; padding: 18px 20px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .block h3 { margin: 0 0 8px; font-size: 18px; }
  .block .level-tag { font-size: 11px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; }
  .block p.body { margin: 0; line-height: 1.65; }
  .block .tr { margin: 12px 0 0; padding-top: 12px; border-top: 1px solid #eee; color: #555; line-height: 1.6; display: none; }
  .block .tr.open { display: block; }
  .block .tr .l { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  button.link { border: none; background: none; color: var(--accent); font-weight: 700; cursor: pointer; font-size: 13px; padding: 8px 0 0; }

  .ex-instruction { color: #fff; font-weight: 600; margin: 0 0 14px; text-align: center; }
  .bank { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 18px; min-height: 46px; }
  .chip {
    padding: 10px 16px; border-radius: 999px; background: #fff; font-weight: 700; font-size: 15px;
    cursor: grab; box-shadow: 0 4px 14px rgba(0,0,0,0.18); user-select: none; transition: transform 0.1s;
  }
  .chip.selected { outline: 3px solid var(--good); transform: scale(1.05); }
  .chip.dragging { opacity: 0.5; }
  .sentence { font-size: 17px; line-height: 2.2; margin: 10px 0; }
  .blank {
    display: inline-block; min-width: 92px; padding: 4px 12px; margin: 0 4px; border-radius: 10px;
    background: #eef0fb; border: 2px dashed #c3c7ef; text-align: center; font-weight: 700; cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .blank.filled { border-style: solid; border-color: var(--accent); background: #fff; }
  .blank.correct { border-color: var(--good); background: #e8f8ef; }
  .blank.wrong { border-color: var(--bad); background: #fdeaea; }
  .score { text-align: center; font-weight: 800; font-size: 16px; margin-top: 12px; min-height: 22px; }
  .score.good { color: var(--good); }
  .score.bad { color: var(--bad); }

  table.grid { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.grid th, table.grid td { padding: 9px 10px; border: 1px solid #e6e4f0; text-align: left; }
  table.grid th { background: #f3f2fb; }
  table.grid tr td:first-child { font-weight: 700; }

  .empty { color: #fff; text-align: center; margin-top: 20px; font-size: 15px; }
</style>
</head>
<body>
<div class="shell">
  <header>
    <h1>Polish Vocabulary</h1>
    <p>Flashcards · Texts · Exercises · Grammar</p>
  </header>

  <div class="levels" id="levels">
    <button data-level="all" class="active">All</button>
    <button data-level="A1">A1</button>
    <button data-level="A2">A2</button>
    <button data-level="B1">B1</button>
    <button data-level="B2">B2</button>
  </div>

  <div class="tabs" id="tabs">
    <button data-tab="flashcards" class="active">Flashcards</button>
    <button data-tab="texts">Texts</button>
    <button data-tab="exercises">Exercises</button>
    <button data-tab="grammar">Grammar</button>
  </div>

  <section class="panel active" id="panel-flashcards">
    <div class="searchbar"><input id="search" type="text" placeholder="Search Polish, English or Spanish…" /></div>
    <div class="card-board">
      <div class="counter" id="fcCounter"></div>
      <div class="card-wrap" id="cardWrap">
        <div class="card" id="card">
          <div class="face front" id="front"></div>
          <div class="face back" id="back"></div>
        </div>
      </div>
      <div class="row-actions">
        <button class="pill" id="prev">← Prev</button>
        <button class="pill" id="shuffle">Shuffle</button>
        <button class="pill" id="next">Next →</button>
      </div>
    </div>
  </section>

  <section class="panel" id="panel-texts"></section>

  <section class="panel" id="panel-exercises">
    <div class="ex-instruction" id="exInstruction"></div>
    <div id="exBody"></div>
    <div class="row-actions">
      <button class="pill" id="exPrev">← Prev</button>
      <button class="pill" id="exCheck">Check</button>
      <button class="pill" id="exNext">Next →</button>
    </div>
    <div class="score" id="exScore"></div>
  </section>

  <section class="panel" id="panel-grammar"></section>
</div>

<script>
  const CATEGORY_COLORS = {
    greetings: "#4f8ff7", phrases: "#34c38f", numbers: "#9b59b6", nouns: "#f39c12",
    verbs: "#e74c3c", adjectives: "#1abc9c", colors: "#e67e22", family: "#8e44ad",
    animals: "#27ae60", food: "#d35400", clothes: "#16a085", house: "#2c3e50",
    city: "#7f8c8d", travel: "#2980b9", time: "#c0392b", adverbs: "#5d6d7e",
    nature: "#27ae60", work: "#b7950b", education: "#2e86c1", body: "#cb4335",
    emotions: "#e74c3c", conjunctions: "#1f618d"
  };
  const LEVELS = ["A1", "A2", "B1", "B2"];

  let DATA = { words: [], texts: [], exercises: [], grammar: [] };
  let level = "all";
  let tab = "flashcards";

  let fcWords = [], fcIndex = 0;
  let txtExpanded = {};
  let exList = [], exIndex = 0, exAnswers = [], exSelected = null, exChecked = false;
  let gList = [];

  function colorFor(cat) { return CATEGORY_COLORS[cat] || "#607d8b"; }
  function shuffle(a) {
    const r = a.slice();
    for (let i = r.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [r[i], r[j]] = [r[j], r[i]];
    }
    return r;
  }

  function applyFilters() {
    fcWords = DATA.words.filter(w => level === "all" || w.level === level);
    fcIndex = 0;
    exList = DATA.exercises.filter(e => level === "all" || e.level === level);
    exIndex = 0;
    gList = DATA.grammar.filter(g => level === "all" || g.level === level);
    txtExpanded = {};
  }

  /* ---------- Flashcards ---------- */
  function renderFlashcards() {
    const card = document.getElementById("card");
    const front = document.getElementById("front");
    const back = document.getElementById("back");
    const counter = document.getElementById("fcCounter");
    const wrap = document.getElementById("cardWrap");
    card.classList.remove("flipped");
    if (!fcWords.length) {
      wrap.style.display = "none";
      counter.textContent = "";
      return;
    }
    wrap.style.display = "block";
    const w = fcWords[fcIndex];
    front.innerHTML = `
      <span class="badge" style="background:${colorFor(w.category)}">${w.category} · ${w.level}</span>
      <div class="hint">Polish</div>
      <div class="word">${w.polish}</div>`;
    back.innerHTML = `
      <span class="badge" style="background:${colorFor(w.category)}">${w.category} · ${w.level}</span>
      <div class="trans">
        <span class="lang">English</span>${w.english}
        <span class="lang" style="margin-top:14px">Español</span>${w.spanish}
      </div>`;
    counter.textContent = `${fcIndex + 1} / ${fcWords.length}`;
  }
  function fcGo(delta) {
    if (!fcWords.length) return;
    fcIndex = (fcIndex + delta + fcWords.length) % fcWords.length;
    renderFlashcards();
  }

  /* ---------- Texts ---------- */
  function renderTexts() {
    const el = document.getElementById("panel-texts");
    const list = DATA.texts.filter(t => level === "all" || t.level === level);
    if (!list.length) { el.innerHTML = `<div class="empty">No texts for this level.</div>`; return; }
    el.innerHTML = list.map(t => `
      <div class="block">
        <div class="level-tag">${t.level}</div>
        <h3>${t.title}</h3>
        <p class="body">${t.body}</p>
        <button class="link" data-toggle="${t.id}">Show translation</button>
        <div class="tr" id="tr-${t.id}">
          <div><span class="l">English</span></div>${t.translation_en}
          <div style="margin-top:12px"><span class="l">Español</span></div>${t.translation_es}
        </div>
      </div>`).join("");
  }
  function toggleText(id) {
    const tr = document.getElementById("tr-" + id);
    const btn = document.querySelector(`[data-toggle="${id}"]`);
    const open = tr.classList.toggle("open");
    btn.textContent = open ? "Hide translation" : "Show translation";
  }

  /* ---------- Exercises ---------- */
  function renderExercises() {
    const inst = document.getElementById("exInstruction");
    const body = document.getElementById("exBody");
    const score = document.getElementById("exScore");
    score.textContent = "";
    if (!exList.length) {
      inst.textContent = "";
      body.innerHTML = `<div class="empty">No exercises for this level.</div>`;
      return;
    }
    const ex = exList[exIndex];
    inst.textContent = `Exercise ${exIndex + 1} / ${exList.length} — ${ex.instruction}`;
    exAnswers = ex.items.map(() => null);
    exSelected = null;
    exChecked = false;

    const bank = shuffle(ex.items.map(i => i.answer));
    body.innerHTML = `
      <div class="block">
        <div class="bank" id="bank">${bank.map(w => `<span class="chip" draggable="true">${w}</span>`).join("")}</div>
        <div id="sentences">
          ${ex.items.map((it, i) => {
            const [before, after] = it.sentence.split("___");
            return `<div class="sentence">${before}<span class="blank" data-i="${i}">···</span>${after || ""}</div>`;
          }).join("")}
        </div>
      </div>`;
    attachExerciseEvents();
  }

  function attachExerciseEvents() {
    const chips = document.querySelectorAll(".chip");
    const blanks = document.querySelectorAll(".blank");

    chips.forEach(ch => {
      ch.addEventListener("click", () => {
        if (exChecked) return;
        chips.forEach(c => c.classList.remove("selected"));
        ch.classList.add("selected");
        exSelected = ch.textContent;
      });
      ch.addEventListener("dragstart", (e) => {
        e.dataTransfer.setData("text/plain", ch.textContent);
        ch.classList.add("dragging");
      });
      ch.addEventListener("dragend", () => ch.classList.remove("dragging"));
    });

    blanks.forEach(b => {
      b.addEventListener("click", () => {
        if (exChecked) return;
        const i = Number(b.dataset.i);
        if (exAnswers[i] !== null) {
          returnWord(exAnswers[i]);
          exAnswers[i] = null;
          b.textContent = "···";
          b.classList.remove("filled");
        } else if (exSelected) {
          exAnswers[i] = exSelected;
          b.textContent = exSelected;
          b.classList.add("filled");
          removeChip(exSelected);
          exSelected = null;
        }
      });
      b.addEventListener("dragover", (e) => e.preventDefault());
      b.addEventListener("drop", (e) => {
        e.preventDefault();
        if (exChecked) return;
        const word = e.dataTransfer.getData("text/plain");
        const i = Number(b.dataset.i);
        if (exAnswers[i] !== null) returnWord(exAnswers[i]);
        exAnswers[i] = word;
        b.textContent = word;
        b.classList.add("filled");
        removeChip(word);
      });
    });
  }

  function removeChip(word) {
    document.querySelectorAll(".chip").forEach(c => {
      if (c.textContent === word) c.remove();
    });
  }
  function returnWord(word) {
    const bank = document.getElementById("bank");
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.draggable = true;
    chip.textContent = word;
    chip.addEventListener("click", () => {
      if (exChecked) return;
      document.querySelectorAll(".chip").forEach(c => c.classList.remove("selected"));
      chip.classList.add("selected");
      exSelected = word;
    });
    chip.addEventListener("dragstart", (e) => { e.dataTransfer.setData("text/plain", word); chip.classList.add("dragging"); });
    chip.addEventListener("dragend", () => chip.classList.remove("dragging"));
    bank.appendChild(chip);
  }

  function checkExercise() {
    const ex = exList[exIndex];
    if (!ex || exChecked) return;
    exChecked = true;
    const blanks = document.querySelectorAll(".blank");
    let correct = 0;
    blanks.forEach(b => {
      const i = Number(b.dataset.i);
      if (exAnswers[i] === ex.items[i].answer) { correct++; b.classList.add("correct"); }
      else { b.classList.add("wrong"); }
    });
    const score = document.getElementById("exScore");
    score.textContent = `${correct} / ${ex.items.length} correct`;
    score.className = "score " + (correct === ex.items.length ? "good" : "bad");
  }

  /* ---------- Grammar ---------- */
  function renderGrammar() {
    const el = document.getElementById("panel-grammar");
    if (!gList.length) { el.innerHTML = `<div class="empty">No grammar tables for this level.</div>`; return; }
    el.innerHTML = gList.map(g => `
      <div class="block">
        <div class="level-tag">${g.level}</div>
        <h3>${g.title}</h3>
        <p style="color:var(--muted);margin:0 0 12px">${g.description}</p>
        <table class="grid">
          <thead><tr>${g.columns.map(c => `<th>${c}</th>`).join("")}</tr></thead>
          <tbody>${g.rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody>
        </table>
      </div>`).join("");
  }

  /* ---------- Tabs & levels ---------- */
  function setTab(t) {
    tab = t;
    document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === t));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    document.getElementById("panel-" + t).classList.add("active");
    render();
  }
  function setLevel(l) {
    level = l;
    document.querySelectorAll("#levels button").forEach(b => b.classList.toggle("active", b.dataset.level === l));
    applyFilters();
    render();
  }
  function render() {
    if (tab === "flashcards") renderFlashcards();
    else if (tab === "texts") renderTexts();
    else if (tab === "exercises") renderExercises();
    else if (tab === "grammar") renderGrammar();
  }

  /* ---------- Events ---------- */
  document.querySelectorAll("#tabs button").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));
  document.querySelectorAll("#levels button").forEach(b => b.addEventListener("click", () => setLevel(b.dataset.level)));

  document.getElementById("card").addEventListener("click", () => document.getElementById("card").classList.toggle("flipped"));
  document.getElementById("next").addEventListener("click", () => fcGo(1));
  document.getElementById("prev").addEventListener("click", () => fcGo(-1));
  document.getElementById("shuffle").addEventListener("click", () => { fcWords = shuffle(fcWords); fcIndex = 0; renderFlashcards(); });

  document.getElementById("search").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    fcWords = DATA.words.filter(w => (level === "all" || w.level === level) &&
      (!q || [w.polish, w.english, w.spanish].some(s => s.toLowerCase().includes(q))));
    fcIndex = 0;
    renderFlashcards();
  });

  document.getElementById("panel-texts").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-toggle]");
    if (btn) toggleText(btn.dataset.toggle);
  });

  document.getElementById("exCheck").addEventListener("click", checkExercise);
  document.getElementById("exNext").addEventListener("click", () => { if (exList.length) { exIndex = (exIndex + 1) % exList.length; renderExercises(); } });
  document.getElementById("exPrev").addEventListener("click", () => { if (exList.length) { exIndex = (exIndex - 1 + exList.length) % exList.length; renderExercises(); } });

  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT") return;
    if (tab === "flashcards") {
      if (e.key === "ArrowRight") fcGo(1);
      else if (e.key === "ArrowLeft") fcGo(-1);
      else if (e.key === " " || e.key === "Enter") { e.preventDefault(); document.getElementById("card").classList.toggle("flipped"); }
    }
  });

  /* ---------- Init ---------- */
  Promise.all([
    fetch("/words").then(r => r.json()),
    fetch("/texts").then(r => r.json()),
    fetch("/exercises").then(r => r.json()),
    fetch("/grammar").then(r => r.json()),
  ]).then(([words, texts, exercises, grammar]) => {
    DATA = { words, texts, exercises, grammar };
    applyFilters();
    render();
  }).catch(() => {
    document.getElementById("front").innerHTML = `<div class="word" style="font-size:20px">Could not load data.</div>`;
  });
</script>
</body>
</html>
