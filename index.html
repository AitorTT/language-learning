<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Language Study</title>
<style>
  :root {
    --bg-1: #667eea;
    --bg-2: #764ba2;
    --card: #ffffff;
    --text: #2d2a3d;
    --muted: #8a869c;
    --accent: #667eea;
    --good: #2ecc71;
    --bad: #e74c3c;
    --shadow: 0 20px 60px rgba(30, 20, 60, 0.25);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
    color: var(--text);
    padding-bottom: 60px;
  }

  .shell {
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 16px;
  }

  header { text-align: center; margin-bottom: 18px; }
  header h1 { color: #fff; margin: 0 0 4px; font-size: 28px; }
  header p { color: rgba(255,255,255,0.85); margin: 0; font-size: 14px; }

  .langpick {
    position: relative;
    max-width: 320px;
    margin: 0 auto 14px;
  }
  .langbtn {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    border: none;
    padding: 11px 18px;
    border-radius: 999px;
    font-family: inherit;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    background: #fff;
    color: var(--accent);
    box-shadow: 0 6px 18px rgba(30, 20, 60, 0.2);
    transition: transform 0.1s, box-shadow 0.15s;
  }
  .langbtn:hover { transform: translateY(-1px); }
  .langbtn .flag { font-size: 19px; line-height: 1; }
  .langbtn .name { flex: 1; text-align: left; }
  .langbtn .caret { font-size: 11px; color: var(--muted); transition: transform 0.15s; }
  .langpick.open .langbtn .caret { transform: rotate(180deg); }

  .langmenu {
    position: absolute;
    z-index: 40;
    top: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    display: none;
    width: min(92vw, 480px);
    padding: 10px;
    border-radius: 16px;
    background: #fff;
    box-shadow: var(--shadow);
    max-height: 60vh;
    overflow-y: auto;
  }
  .langpick.open .langmenu {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(82px, 1fr));
    gap: 6px;
  }
  .langmenu button {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.15;
    text-align: center;
    color: var(--text);
    padding: 9px 4px;
    border-radius: 10px;
    cursor: pointer;
  }
  .langmenu button:hover { background: rgba(102, 126, 234, 0.12); }
  .langmenu button.active { background: var(--accent); color: #fff; }
  .langmenu .flag { font-size: 22px; line-height: 1; }

  .levels {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .levels button {
    border: none;
    padding: 8px 16px;
    border-radius: 999px;
    font-weight: 700;
    cursor: pointer;
    font-size: 13px;
    background: rgba(255,255,255,0.22);
    color: #fff;
    transition: background 0.15s, transform 0.1s;
  }
  .levels button.active { background: #fff; color: var(--accent); }
  .levels button:hover { transform: translateY(-1px); }

  .tabs {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }
  .tabs button {
    border: none;
    padding: 10px 18px;
    border-radius: 999px;
    font-weight: 700;
    cursor: pointer;
    font-size: 14px;
    background: rgba(255,255,255,0.22);
    color: #fff;
    transition: background 0.15s;
  }
  .tabs button.active { background: #fff; color: var(--accent); }

  .panel { display: none; }
  .panel.active { display: block; }

  .card-board { display: flex; flex-direction: column; align-items: center; }
  .counter { color: rgba(255,255,255,0.9); font-size: 13px; margin-bottom: 12px; }
  .card-wrap { perspective: 1200px; width: 100%; max-width: 420px; height: 260px; cursor: pointer; }
  .card { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4,0.2,0.2,1); }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; border-radius: 20px; background: var(--card);
    box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 24px; backface-visibility: hidden;
    -webkit-backface-visibility: hidden; text-align: center;
  }
  .face.back { transform: rotateY(180deg); }
  .word { font-size: 40px; font-weight: 800; margin: 8px 0; word-break: break-word; }
  .ipa { color: var(--muted); font-size: 17px; margin-top: 2px; letter-spacing: 0.5px; }
  .ipa.pinyin { font-style: italic; }
  .hint { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
  .badge {
    display: inline-block; padding: 5px 14px; border-radius: 999px; font-size: 12px; font-weight: 700;
    letter-spacing: 0.5px; color: #fff; text-transform: uppercase; margin-bottom: 6px;
  }
  .trans { font-size: 22px; font-weight: 600; line-height: 1.5; }
  .trans .lang { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 2px; }

  .searchbar { text-align: center; margin-bottom: 16px; }
  .searchbar input {
    padding: 12px 16px; border: none; border-radius: 999px; font-size: 15px; width: 260px;
    outline: none; box-shadow: 0 6px 20px rgba(0,0,0,0.15);
  }

  .row-actions { display: flex; gap: 12px; justify-content: center; margin-top: 22px; }
  button.pill {
    border: none; padding: 12px 18px; border-radius: 999px; font-size: 14px; font-weight: 700;
    cursor: pointer; background: #fff; color: var(--text); box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  button.pill:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(0,0,0,0.2); }

  .block { background: var(--card); border-radius: 16px; padding: 18px 20px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .block h3 { margin: 0 0 8px; font-size: 18px; }
  .block .level-tag { font-size: 11px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; }
  .block p.body { margin: 0; line-height: 1.65; }
  .block .tr { margin: 12px 0 0; padding-top: 12px; border-top: 1px solid #eee; color: #555; line-height: 1.6; display: none; }
  .block .tr.open { display: block; }
  .block .tr .l { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  button.link { border: none; background: none; color: var(--accent); font-weight: 700; cursor: pointer; font-size: 13px; padding: 8px 0 0; }

  .ex-instruction { color: #fff; font-weight: 600; margin: 0 0 14px; text-align: center; }
  .bank { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 18px; min-height: 46px; }
  .chip {
    padding: 10px 16px; border-radius: 999px; background: #fff; font-weight: 700; font-size: 15px;
    cursor: grab; box-shadow: 0 4px 14px rgba(0,0,0,0.18); user-select: none; transition: transform 0.1s;
  }
  .chip.selected { outline: 3px solid var(--good); transform: scale(1.05); }
  .chip.dragging { opacity: 0.5; }
  .sentence { font-size: 17px; line-height: 2.2; margin: 10px 0; }
  .tr-line { display: none; color: #6b6880; font-size: 13px; line-height: 1.5; margin: -8px 0 14px; }
  .tr-line.show { display: block; }
  .tr-line .l { font-weight: 700; color: var(--accent); }
  .blank {
    display: inline-block; min-width: 92px; padding: 4px 12px; margin: 0 4px; border-radius: 10px;
    background: #eef0fb; border: 2px dashed #c3c7ef; text-align: center; font-weight: 700; cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .blank.filled { border-style: solid; border-color: var(--accent); background: #fff; }
  .blank.correct { border-color: var(--good); background: #e8f8ef; }
  .blank.wrong { border-color: var(--bad); background: #fdeaea; }
  .score { text-align: center; font-weight: 800; font-size: 16px; margin-top: 12px; min-height: 22px; }
  .score.good { color: var(--good); }
  .score.bad { color: var(--bad); }

  table.grid { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.grid th, table.grid td { padding: 9px 10px; border: 1px solid #e6e4f0; text-align: left; }
  table.grid th { background: #f3f2fb; }
  table.grid tr td:first-child { font-weight: 700; }

  .empty { color: #fff; text-align: center; margin-top: 20px; font-size: 15px; }

  .textinput {
    width: 100%; padding: 12px 14px; border: 1px solid #ddd; border-radius: 12px;
    font-size: 15px; font-family: inherit; margin-bottom: 12px; outline: none; color: var(--text);
  }
  .textinput:focus { border-color: var(--accent); }
  textarea.textinput { resize: vertical; line-height: 1.6; }
  #writeLocked .textinput { max-width: 260px; margin: 0 auto 12px; }
  .note-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .note-date { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .note-content { white-space: pre-wrap; line-height: 1.65; margin: 8px 0 0; }
  button.danger { background: #fdeaea; color: var(--bad); }

  button.speak {
    display: inline-flex; align-items: center; justify-content: center;
    border: none; background: #eef0fb; color: var(--accent); cursor: pointer;
    width: 34px; height: 34px; border-radius: 50%; padding: 0; flex: none;
    vertical-align: middle; transition: background 0.15s, color 0.15s, transform 0.1s;
  }
  button.speak svg { width: 16px; height: 16px; display: block; }
  button.speak:hover { background: #dfe3fb; transform: translateY(-1px); }
  button.speak.speaking { background: var(--accent); color: #fff; }
  .text-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .text-head h3 { margin: 0; }
  table.grid th.act, table.grid td.act { width: 46px; text-align: center; }
  .tablewrap { overflow-x: auto; }

  /* ---------- Compare ---------- */
  .cmp-intro { color: #fff; text-align: center; margin: 0 0 16px; font-size: 14px; }
  .cmp-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .cmp-head h3 { margin: 0; font-size: 18px; }
  .cmp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 8px; }
  .cmp-tile {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    border-radius: 10px; background: rgba(102, 126, 234, 0.08);
  }
  .cmp-tile.active { background: rgba(102, 126, 234, 0.18); box-shadow: inset 0 0 0 2px var(--accent); }
  .cmp-lang { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 62px; flex: none; }
  .cmp-lang .flag { font-size: 20px; line-height: 1; }
  .cmp-lang .name { font-size: 10px; font-weight: 600; color: var(--muted); text-align: center; line-height: 1.1; }
  .cmp-term { font-size: 16px; font-weight: 700; word-break: break-word; }
  .cmp-term.missing { color: var(--muted); font-weight: 400; }
  .cmp-termwrap { flex: 1; min-width: 0; }
  .cmp-pron { font-size: 12px; color: var(--muted); margin-top: 2px; word-break: break-word; }
  .cmp-tile button.speak { width: 30px; height: 30px; }
  .cmp-tile button.speak svg { width: 14px; height: 14px; }
</style>
</head>
<body>
<div class="shell">
  <header>
    <h1>Language Study</h1>
    <p id="subtitle">Choose a language to begin</p>
  </header>

  <div class="langpick" id="langpick">
    <button class="langbtn" id="langBtn" aria-haspopup="listbox" aria-expanded="false">
      <span class="flag" id="langBtnFlag"></span>
      <span class="name" id="langBtnName"></span>
      <span class="caret">▼</span>
    </button>
    <div class="langmenu" id="langMenu" role="listbox" aria-label="Language"></div>
  </div>

  <div class="levels" id="levels">
    <button data-level="all" class="active">All</button>
    <button data-level="A1">A1</button>
    <button data-level="A2">A2</button>
    <button data-level="B1">B1</button>
    <button data-level="B2">B2</button>
  </div>

  <div class="tabs" id="tabs">
    <button data-tab="flashcards" class="active">Flashcards</button>
    <button data-tab="texts">Texts</button>
    <button data-tab="exercises">Exercises</button>
    <button data-tab="grammar">Grammar</button>
    <button data-tab="compare">Compare</button>
    <button data-tab="writing">Writing</button>
  </div>

  <section class="panel active" id="panel-flashcards">
    <div class="searchbar"><input id="search" type="text" placeholder="Search…" /></div>
    <div class="card-board">
      <div class="counter" id="fcCounter"></div>
      <div class="card-wrap" id="cardWrap">
        <div class="card" id="card">
          <div class="face front" id="front"></div>
          <div class="face back" id="back"></div>
        </div>
      </div>
      <div class="row-actions">
        <button class="pill" id="prev">← Prev</button>
        <button class="pill" id="shuffle">Shuffle</button>
        <button class="pill" id="next">Next →</button>
      </div>
    </div>
  </section>

  <section class="panel" id="panel-texts"></section>

  <section class="panel" id="panel-exercises">
    <div class="ex-instruction" id="exInstruction"></div>
    <div id="exBody"></div>
    <div class="row-actions">
      <button class="pill" id="exPrev">← Prev</button>
      <button class="pill" id="exCheck">Check</button>
      <button class="pill" id="exTr">Translations</button>
      <button class="pill" id="exNext">Next →</button>
    </div>
    <div class="score" id="exScore"></div>
  </section>

  <section class="panel" id="panel-grammar"></section>

  <section class="panel" id="panel-compare"></section>

  <section class="panel" id="panel-writing">
    <div id="writeLocked" class="block" style="text-align:center">
      <h3>Your notes</h3>
      <p style="color:var(--muted);margin:0 0 14px">Enter the password to read and save your writing.</p>
      <input id="pwInput" type="password" placeholder="Password" class="textinput" />
      <div class="row-actions">
        <button class="pill" id="pwUnlock">Unlock</button>
      </div>
      <div class="score" id="pwError"></div>
    </div>

    <div id="writeApp" style="display:none">
      <div class="block">
        <input id="noteTitle" class="textinput" placeholder="Title (optional)" />
        <textarea id="noteContent" class="textinput" rows="8" dir="auto" placeholder="Write in Polish here…"></textarea>
        <div class="row-actions">
          <button class="pill" id="noteSave">Save</button>
          <button class="pill" id="noteLock">Lock</button>
        </div>
        <div class="score" id="noteMsg"></div>
      </div>
      <div id="notesList"></div>
    </div>
  </section>
</div>

<script>
  const CATEGORY_COLORS = {
    greetings: "#4f8ff7", phrases: "#34c38f", numbers: "#9b59b6", nouns: "#f39c12",
    verbs: "#e74c3c", adjectives: "#1abc9c", colors: "#e67e22", family: "#8e44ad",
    animals: "#27ae60", food: "#d35400", clothes: "#16a085", house: "#2c3e50",
    city: "#7f8c8d", travel: "#2980b9", time: "#c0392b", adverbs: "#5d6d7e",
    nature: "#27ae60", work: "#b7950b", education: "#2e86c1", body: "#cb4335",
    emotions: "#e74c3c", conjunctions: "#1f618d",
    weather: "#3d9be9", directions: "#0e7490", sports: "#e74c3c", music: "#8e44ad",
    money: "#b7950b", environment: "#2ecc71", society: "#34495e", science: "#2980b9",
    technology: "#6c5ce7", health: "#e84393", transport: "#00b894", shopping: "#e17055",
    prepositions: "#636e72", questions: "#0984e3", hobbies: "#fdcb6e", geography: "#00cec9",
    arts: "#a29bfe", feelings: "#fd79a8"
  };
  const LEVELS = ["A1", "A2", "B1", "B2"];

  let DATA = { words: [], texts: [], exercises: [], grammar: [] };
  let level = "all";
  let tab = "flashcards";

  let LANGS = [];
  let LANG_BY_CODE = {};
  let lang = null;
  const DATA_CACHE = {};

  let fcWords = [], fcIndex = 0;
  let txtExpanded = {};
  let exList = [], exIndex = 0, exAnswers = [], exSelected = null, exChecked = false, exShowTr = false;
  let gList = [];

  let writePw = "", notesCache = [];
  const NOTES_KEY = "pv_notes";
  const DRAFT_KEY = "pv_draft";

  function colorFor(cat) { return CATEGORY_COLORS[cat] || "#607d8b"; }
  function shuffle(a) {
    const r = a.slice();
    for (let i = r.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [r[i], r[j]] = [r[j], r[i]];
    }
    return r;
  }

  /* ---------- Speech (browser text-to-speech) ---------- */
  const ICON_SPEAK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 9v6h3.5L11 19V5L6.5 9H3zm11.6 3a3.6 3.6 0 0 0-2-3.24v6.48A3.6 3.6 0 0 0 14.6 12zM12.6 3.1v2.05a6.85 6.85 0 0 1 0 13.7v2.05a8.9 8.9 0 0 0 0-17.8z"/></svg>';
  const ICON_STOP = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect fill="currentColor" x="6" y="6" width="12" height="12" rx="2"/></svg>';
  const SPANISH_HEADERS = ["español", "espanol", "spanish"];

  let VOICES = [];
  let currentSpeechBtn = null;

  function speechSupported() { return typeof window !== "undefined" && "speechSynthesis" in window; }
  function loadVoices() { if (speechSupported()) VOICES = window.speechSynthesis.getVoices() || []; }

  function pickVoice(locale) {
    if (!VOICES.length) loadVoices();
    const want = String(locale).replace("_", "-").toLowerCase();
    const base = want.split("-")[0];
    return VOICES.find(v => String(v.lang || "").replace("_", "-").toLowerCase() === want)
        || VOICES.find(v => String(v.lang || "").toLowerCase().startsWith(base))
        || null;
  }

  function stopSpeech() {
    if (speechSupported() && (window.speechSynthesis.speaking || window.speechSynthesis.pending)) {
      window.speechSynthesis.cancel();
    }
    if (currentSpeechBtn) {
      currentSpeechBtn.classList.remove("speaking");
      currentSpeechBtn.innerHTML = ICON_SPEAK;
      currentSpeechBtn = null;
    }
  }

  function speak(text, code, btn) {
    if (!speechSupported() || !text) return;
    const wasActive = currentSpeechBtn === btn;
    stopSpeech();
    if (wasActive) return;
    const cfg = LANG_BY_CODE[code];
    const locale = (cfg && cfg.speech) || "en-US";
    const u = new SpeechSynthesisUtterance(text);
    u.lang = locale;
    const v = pickVoice(locale);
    if (v) u.voice = v;
    const finish = () => { if (currentSpeechBtn === btn) stopSpeech(); };
    u.onend = finish;
    u.onerror = finish;
    currentSpeechBtn = btn || null;
    if (btn) { btn.classList.add("speaking"); btn.innerHTML = ICON_STOP; }
    window.speechSynthesis.speak(u);
  }

  function grammarRowText(g, row) {
    const target = (lang && lang.code) || "en";
    const cjk = lang && lang.script === "cjk";
    const japanese = lang && lang.script === "japanese";
    const arabic = lang && lang.script === "arabic";
    const devanagari = lang && lang.script === "devanagari";
    const cyrillic = lang && lang.script === "cyrillic";
    const skip = new Set(SPANISH_HEADERS);
    if (target !== "en") skip.add("english");
    const parts = [];
    g.columns.forEach((c, i) => {
      const v = row[i];
      if (v === undefined || v === null || v === "" || v === "—" || v === "-") return;
      if (cyrillic) {
        String(v).split(/[→←]/).forEach(seg => {
          const cy = seg.replace(/[^\u0400-\u04ff\u0500-\u052f\u2de0-\u2dff\ua640-\ua69f\s]/g, "").replace(/\s+/g, " ").trim();
          if (cy) parts.push(cy);
        });
        return;
      }
      if (devanagari) {
        String(v).split(/[→←]/).forEach(seg => {
          const hi = seg.replace(/[^\u0900-\u097f\ua8e0-\ua8ff\s]/g, "").replace(/\s+/g, " ").trim();
          if (hi) parts.push(hi);
        });
        return;
      }
      if (arabic) {
        String(v).split(/[→←]/).forEach(seg => {
          const ar = seg.replace(/[^\u0600-\u06ff\u0750-\u077f\u08a0-\u08ff\ufb50-\ufdff\ufe70-\ufeff\s]/g, "").replace(/\s+/g, " ").trim();
          if (ar) parts.push(ar);
        });
        return;
      }
      if (japanese) {
        if (!/[\u3040-\u30ff\u3400-\u9fff]/.test(String(v))) return;
        const jp = String(v).replace(/[^\u3040-\u30ff\u3400-\u9fff\u3000-\u303f\uff00-\uffef]/g, "");
        if (jp) parts.push(jp);
        return;
      }
      if (cjk) {
        if (!/[\u3400-\u9fff]/.test(String(v))) return;
        const han = String(v).replace(/[^\u3400-\u9fff\u3000-\u303f\uff00-\uffef]/g, "");
        if (han) parts.push(han);
        return;
      }
      if (skip.has(String(c).trim().toLowerCase())) return;
      parts.push(v);
    });
    return parts.join(", ");
  }

  if (speechSupported()) {
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }

  function applyFilters() {
    fcWords = DATA.words.filter(w => level === "all" || w.level === level);
    fcIndex = 0;
    exList = DATA.exercises.filter(e => level === "all" || e.level === level);
    exIndex = 0;
    gList = DATA.grammar.filter(g => level === "all" || g.level === level);
    txtExpanded = {};
  }

  /* ---------- Flashcards ---------- */
  function renderFlashcards() {
    stopSpeech();
    const card = document.getElementById("card");
    const front = document.getElementById("front");
    const back = document.getElementById("back");
    const counter = document.getElementById("fcCounter");
    const wrap = document.getElementById("cardWrap");
    card.classList.remove("flipped");
    if (!fcWords.length) {
      wrap.style.display = "none";
      counter.textContent = "";
      return;
    }
    wrap.style.display = "block";
    const w = fcWords[fcIndex];
    front.innerHTML = `
      <span class="badge" style="background:${colorFor(w.category)}">${w.category} · ${w.level}</span>
      <div class="hint">${lang.termLabel}</div>
      <div class="word" dir="auto">${w[lang.termField]}</div>
      ${w.ipa
        ? `<div class="ipa">/${w.ipa}/</div>`
        : (w.pinyin || w.romaji || w.translit
            ? `<div class="ipa pinyin">${w.pinyin || w.romaji || w.translit}</div>` : "")}
      <button class="speak" type="button" title="Listen" aria-label="Listen" data-fc-speak>${ICON_SPEAK}</button>`;
    back.innerHTML = `
      <span class="badge" style="background:${colorFor(w.category)}">${w.category} · ${w.level}</span>
      <div class="trans">
        ${lang.targets.map((t, i) =>
          `<span class="lang"${i ? ' style="margin-top:14px"' : ""}>${t.label}</span>${w[t.field]}`
        ).join("")}
      </div>`;
    counter.textContent = `${fcIndex + 1} / ${fcWords.length}`;
    const btn = front.querySelector("[data-fc-speak]");
    if (!speechSupported()) { btn.style.display = "none"; }
    else btn.addEventListener("click", (e) => { e.stopPropagation(); speak(w[lang.termField], lang.code, btn); });
  }
  function fcGo(delta) {
    if (!fcWords.length) return;
    fcIndex = (fcIndex + delta + fcWords.length) % fcWords.length;
    renderFlashcards();
  }

  /* ---------- Texts ---------- */
  function translationBlocks(item) {
    return lang.targets
      .filter(tg => item["translation_" + tg.code])
      .map(tg => `<div style="margin-top:12px"><span class="l">${tg.label}</span></div>${item["translation_" + tg.code]}`)
      .join("");
  }
  function renderTexts() {
    stopSpeech();
    const el = document.getElementById("panel-texts");
    const list = DATA.texts.filter(t => level === "all" || t.level === level);
    if (!list.length) { el.innerHTML = `<div class="empty">No texts for this level.</div>`; return; }
    el.innerHTML = list.map(t => `
      <div class="block">
        <div class="level-tag">${t.level}</div>
        <div class="text-head">
          <h3>${t.title}</h3>
          <button class="speak" type="button" title="Listen" aria-label="Listen" data-text-speak="${t.id}">${ICON_SPEAK}</button>
        </div>
        <p class="body" dir="auto">${t.body}</p>
        <button class="link" data-toggle="${t.id}">Hide translation</button>
        <div class="tr open" id="tr-${t.id}">${translationBlocks(t)}</div>
      </div>`).join("");
    el.querySelectorAll("[data-text-speak]").forEach(btn => {
      if (!speechSupported()) { btn.style.display = "none"; return; }
      const t = list.find(x => String(x.id) === btn.dataset.textSpeak);
      if (t) btn.addEventListener("click", () => speak(t.body, lang.code, btn));
    });
  }
  function toggleText(id) {
    const tr = document.getElementById("tr-" + id);
    const btn = document.querySelector(`[data-toggle="${id}"]`);
    const open = tr.classList.toggle("open");
    btn.textContent = open ? "Hide translation" : "Show translation";
  }

  /* ---------- Exercises ---------- */
  function renderExercises() {
    stopSpeech();
    const inst = document.getElementById("exInstruction");
    const body = document.getElementById("exBody");
    const score = document.getElementById("exScore");
    score.textContent = "";
    if (!exList.length) {
      inst.textContent = "";
      body.innerHTML = `<div class="empty">No exercises for this level.</div>`;
      return;
    }
    const ex = exList[exIndex];
    inst.textContent = `Exercise ${exIndex + 1} / ${exList.length} — ${ex.instruction}`;
    exAnswers = ex.items.map(() => null);
    exSelected = null;
    exChecked = false;

    const bank = shuffle(ex.items.map(i => i.answer));
    body.innerHTML = `
      <div class="block">
        <div class="bank" id="bank">${bank.map(w => `<span class="chip" dir="auto" draggable="true">${w}</span>`).join("")}</div>
        <div id="sentences">
          ${ex.items.map((it, i) => {
            const [before, after] = it.sentence.split("___");
            const tr = lang.targets
              .map(tg => { const v = it["translation_" + tg.code] || ""; return v ? `<span class="l">${tg.label}</span> ${v}` : ""; })
              .filter(Boolean).join("<br>");
            const play = speechSupported() ? `<button class="speak" type="button" title="Listen" aria-label="Listen" data-sent="${i}">${ICON_SPEAK}</button>` : "";
            return `<div class="sentence">${play}<span class="sentence-text" dir="auto">${before}<span class="blank" data-i="${i}">···</span>${after || ""}</span></div>
              <div class="tr-line" data-tr="${i}">${tr}</div>`;
          }).join("")}
        </div>
      </div>`;
    attachExerciseEvents();
    applyTranslations();
  }

  function applyTranslations() {
    document.querySelectorAll(".tr-line").forEach(el => el.classList.toggle("show", exShowTr));
  }

  function attachExerciseEvents() {
    const chips = document.querySelectorAll(".chip");
    const blanks = document.querySelectorAll(".blank");

    chips.forEach(ch => {
      ch.addEventListener("click", () => {
        if (exChecked) return;
        chips.forEach(c => c.classList.remove("selected"));
        ch.classList.add("selected");
        exSelected = ch.textContent;
      });
      ch.addEventListener("dragstart", (e) => {
        e.dataTransfer.setData("text/plain", ch.textContent);
        ch.classList.add("dragging");
      });
      ch.addEventListener("dragend", () => ch.classList.remove("dragging"));
    });

    blanks.forEach(b => {
      b.addEventListener("click", () => {
        if (exChecked) return;
        const i = Number(b.dataset.i);
        if (exAnswers[i] !== null) {
          returnWord(exAnswers[i]);
          exAnswers[i] = null;
          b.textContent = "···";
          b.classList.remove("filled");
        } else if (exSelected) {
          exAnswers[i] = exSelected;
          b.textContent = exSelected;
          b.classList.add("filled");
          removeChip(exSelected);
          exSelected = null;
        }
      });
      b.addEventListener("dragover", (e) => e.preventDefault());
      b.addEventListener("drop", (e) => {
        e.preventDefault();
        if (exChecked) return;
        const word = e.dataTransfer.getData("text/plain");
        const i = Number(b.dataset.i);
        if (exAnswers[i] !== null) returnWord(exAnswers[i]);
        exAnswers[i] = word;
        b.textContent = word;
        b.classList.add("filled");
        removeChip(word);
      });
    });

    const ex = exList[exIndex];
    if (ex) {
      document.querySelectorAll("[data-sent]").forEach(btn => {
        const i = Number(btn.dataset.sent);
        const it = ex.items[i];
        if (!it) return;
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const full = String(it.sentence).replace(/___/g, it.answer);
          speak(full, lang.code, btn);
        });
      });
    }
  }

  function removeChip(word) {
    document.querySelectorAll(".chip").forEach(c => {
      if (c.textContent === word) c.remove();
    });
  }
  function returnWord(word) {
    const bank = document.getElementById("bank");
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.draggable = true;
    chip.textContent = word;
    chip.addEventListener("click", () => {
      if (exChecked) return;
      document.querySelectorAll(".chip").forEach(c => c.classList.remove("selected"));
      chip.classList.add("selected");
      exSelected = word;
    });
    chip.addEventListener("dragstart", (e) => { e.dataTransfer.setData("text/plain", word); chip.classList.add("dragging"); });
    chip.addEventListener("dragend", () => chip.classList.remove("dragging"));
    bank.appendChild(chip);
  }

  function checkExercise() {
    const ex = exList[exIndex];
    if (!ex || exChecked) return;
    exChecked = true;
    const blanks = document.querySelectorAll(".blank");
    let correct = 0;
    blanks.forEach(b => {
      const i = Number(b.dataset.i);
      if (exAnswers[i] === ex.items[i].answer) { correct++; b.classList.add("correct"); }
      else { b.classList.add("wrong"); }
    });
    const score = document.getElementById("exScore");
    score.textContent = `${correct} / ${ex.items.length} correct`;
    score.className = "score " + (correct === ex.items.length ? "good" : "bad");
    exShowTr = true;
    applyTranslations();
  }

  /* ---------- Grammar ---------- */
  function renderGrammar() {
    stopSpeech();
    const el = document.getElementById("panel-grammar");
    if (!gList.length) { el.innerHTML = `<div class="empty">No grammar tables for this level.</div>`; return; }
    const canSpeak = speechSupported();
    el.innerHTML = gList.map(g => `
      <div class="block">
        <div class="level-tag">${g.level}</div>
        <h3>${g.title}</h3>
        <p style="color:var(--muted);margin:0 0 12px">${g.description}</p>
        <div class="tablewrap"><table class="grid">
          <thead><tr>${canSpeak ? '<th class="act"></th>' : ""}${g.columns.map(c => `<th>${c}</th>`).join("")}</tr></thead>
          <tbody>${g.rows.map((r, ri) => `<tr>${canSpeak ? `<td class="act"><button class="speak" type="button" title="Listen" aria-label="Listen" data-gr-row="${g.id}:${ri}">${ICON_SPEAK}</button></td>` : ""}${r.map(c => `<td dir="auto">${c}</td>`).join("")}</tr>`).join("")}</tbody>
        </table></div>
      </div>`).join("");
    if (!canSpeak) return;
    el.querySelectorAll("[data-gr-row]").forEach(btn => {
      const [gid, ri] = String(btn.dataset.grRow).split(":");
      const g = gList.find(x => String(x.id) === gid);
      if (!g) return;
      const text = grammarRowText(g, g.rows[Number(ri)] || []);
      btn.addEventListener("click", () => speak(text, lang.code, btn));
    });
  }

  /* ---------- Writing ---------- */
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function formatDate(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    return isNaN(d) ? "" : d.toLocaleString();
  }
  function cacheNotes() {
    try { localStorage.setItem(NOTES_KEY, JSON.stringify(notesCache)); } catch (e) {}
  }
  function loadCachedNotes() {
    try { notesCache = JSON.parse(localStorage.getItem(NOTES_KEY) || "[]"); } catch (e) { notesCache = []; }
  }
  function renderNotes() {
    const el = document.getElementById("notesList");
    if (!notesCache.length) { el.innerHTML = ""; return; }
    el.innerHTML = notesCache.map(n => `
      <div class="block">
        <div class="note-head">
          <h3 style="margin:0">${escapeHtml(n.title)}</h3>
          <span class="note-date">${formatDate(n.created)}</span>
        </div>
        <p class="note-content">${escapeHtml(n.content)}</p>
        <div class="row-actions" style="justify-content:flex-start;margin-top:10px">
          <button class="pill danger" data-del="${n.id}">Delete</button>
        </div>
      </div>`).join("");
  }
  function renderWriting() {
    document.getElementById("writeLocked").style.display = writePw ? "none" : "block";
    document.getElementById("writeApp").style.display = writePw ? "block" : "none";
  }
  function unlockWriting() {
    const pw = document.getElementById("pwInput").value;
    const err = document.getElementById("pwError");
    if (!pw) { err.textContent = "Enter the password."; return; }
    err.textContent = "Checking…";
    fetch("/notes", { headers: { "X-Password": pw } }).then(r => {
      if (r.status === 401) { err.textContent = "Wrong password."; throw new Error("401"); }
      if (!r.ok) { err.textContent = "Saving is not available."; throw new Error("bad"); }
      return r.json();
    }).then(serverNotes => {
      writePw = pw;
      loadCachedNotes();
      if (serverNotes.length) { notesCache = serverNotes; cacheNotes(); }
      const draft = localStorage.getItem(DRAFT_KEY);
      if (draft) document.getElementById("noteContent").value = draft;
      err.textContent = "";
      renderNotes();
      renderWriting();
    }).catch(() => {});
  }
  function lockWriting() {
    writePw = "";
    document.getElementById("pwInput").value = "";
    renderWriting();
  }
  function saveNote() {
    const content = document.getElementById("noteContent").value.trim();
    const title = document.getElementById("noteTitle").value.trim();
    const msg = document.getElementById("noteMsg");
    if (!content) { msg.textContent = "Nothing to save."; msg.className = "score bad"; return; }
    msg.textContent = "Saving…"; msg.className = "score";
    fetch("/notes", {
      method: "POST",
      headers: { "X-Password": writePw, "Content-Type": "application/json" },
      body: JSON.stringify({ title, content })
    }).then(r => {
      if (r.status === 401) { lockWriting(); throw new Error("401"); }
      if (!r.ok) throw new Error("bad");
      return r.json();
    }).then(note => {
      notesCache = [note, ...notesCache];
      cacheNotes();
      renderNotes();
      document.getElementById("noteContent").value = "";
      document.getElementById("noteTitle").value = "";
      localStorage.removeItem(DRAFT_KEY);
      msg.textContent = "Saved"; msg.className = "score good";
    }).catch(() => {
      if (msg.textContent === "Saving…") { msg.textContent = "Could not save."; msg.className = "score bad"; }
    });
  }
  function deleteNote(id) {
    fetch("/notes/" + encodeURIComponent(id), { method: "DELETE", headers: { "X-Password": writePw } })
      .catch(() => {})
      .then(() => {
        notesCache = notesCache.filter(n => String(n.id) !== String(id));
        cacheNotes();
        renderNotes();
      });
  }

  /* ---------- Tabs & levels ---------- */
  function setTab(t) {
    stopSpeech();
    tab = t;
    document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === t));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    document.getElementById("panel-" + t).classList.add("active");
    document.getElementById("levels").style.display = t === "compare" ? "none" : "";
    render();
  }
  function setLevel(l) {
    level = l;
    document.querySelectorAll("#levels button").forEach(b => b.classList.toggle("active", b.dataset.level === l));
    applyFilters();
    render();
  }
  function render() {
    if (tab === "flashcards") renderFlashcards();
    else if (tab === "texts") renderTexts();
    else if (tab === "exercises") renderExercises();
    else if (tab === "grammar") renderGrammar();
    else if (tab === "compare") renderCompare();
    else if (tab === "writing") renderWriting();
  }

  /* ---------- Compare ---------- */
  let COMPARE = null;

  function compareTile(l, cell) {
    const data = cell || {};
    const term = data.term;
    const has = term !== undefined && term !== null && term !== "";
    const pron = data.pron || "";
    const active = lang && l.code === lang.code ? " active" : "";
    const btn = speechSupported()
      ? `<button class="speak" type="button" title="Listen" aria-label="Listen" data-cmp-code="${l.code}" data-cmp-text="${has ? escapeHtml(term) : ""}">${ICON_SPEAK}</button>`
      : "";
    const pronHtml = pron
      ? `<div class="cmp-pron" dir="auto">${data.kind === "ipa" ? `/${escapeHtml(pron)}/` : escapeHtml(pron)}</div>`
      : "";
    return `<div class="cmp-tile${active}">
        <div class="cmp-lang"><span class="flag">${l.flag || ""}</span><span class="name">${l.name}</span></div>
        <div class="cmp-termwrap">
          <div class="cmp-term${has ? "" : " missing"}" dir="auto">${has ? escapeHtml(term) : "—"}</div>
          ${pronHtml}
        </div>
        ${btn}
      </div>`;
  }

  function renderCompare() {
    stopSpeech();
    const el = document.getElementById("panel-compare");
    if (!COMPARE) {
      el.innerHTML = `<div class="empty">Loading…</div>`;
      fetch("/compare").then(r => r.json()).then(data => {
        COMPARE = data;
        if (tab === "compare") renderCompare();
      }).catch(() => {
        el.innerHTML = `<div class="empty">Could not load the comparison.</div>`;
      });
      return;
    }
    const blocks = COMPARE.words.map(w => `
      <div class="block">
        <div class="cmp-head"><h3>${escapeHtml(w.concept)}</h3></div>
        <div class="cmp-grid">${COMPARE.languages.map(l => compareTile(l, w.terms[l.code])).join("")}</div>
      </div>`).join("");
    el.innerHTML =
      `<p class="cmp-intro">The same word in all ${COMPARE.languages.length} languages. Tap a speaker to hear it.</p>` + blocks;
  }

  document.getElementById("panel-compare").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-cmp-code]");
    if (btn) speak(btn.dataset.cmpText, btn.dataset.cmpCode, btn);
  });

  /* ---------- Events ---------- */
  document.querySelectorAll("#tabs button").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));
  document.querySelectorAll("#levels button").forEach(b => b.addEventListener("click", () => setLevel(b.dataset.level)));

  document.getElementById("card").addEventListener("click", () => document.getElementById("card").classList.toggle("flipped"));
  document.getElementById("next").addEventListener("click", () => fcGo(1));
  document.getElementById("prev").addEventListener("click", () => fcGo(-1));
  document.getElementById("shuffle").addEventListener("click", () => { fcWords = shuffle(fcWords); fcIndex = 0; renderFlashcards(); });

  document.getElementById("search").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    const fields = [lang.termField, ...lang.targets.map(t => t.field)];
    fcWords = DATA.words.filter(w => (level === "all" || w.level === level) &&
      (!q || fields.some(f => String(w[f] || "").toLowerCase().includes(q))));
    fcIndex = 0;
    renderFlashcards();
  });

  document.getElementById("panel-texts").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-toggle]");
    if (btn) toggleText(btn.dataset.toggle);
  });

  document.getElementById("exCheck").addEventListener("click", checkExercise);
  document.getElementById("exTr").addEventListener("click", () => { exShowTr = !exShowTr; applyTranslations(); });

  document.getElementById("pwUnlock").addEventListener("click", unlockWriting);
  document.getElementById("pwInput").addEventListener("keydown", (e) => { if (e.key === "Enter") unlockWriting(); });
  document.getElementById("noteSave").addEventListener("click", saveNote);
  document.getElementById("noteLock").addEventListener("click", lockWriting);
  document.getElementById("noteContent").addEventListener("input", (e) => {
    try { localStorage.setItem(DRAFT_KEY, e.target.value); } catch (err) {}
  });
  document.getElementById("noteContent").addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") saveNote();
  });
  document.getElementById("notesList").addEventListener("click", (e) => {
    const b = e.target.closest("[data-del]");
    if (b) deleteNote(b.dataset.del);
  });
  document.getElementById("exNext").addEventListener("click", () => { if (exList.length) { exIndex = (exIndex + 1) % exList.length; renderExercises(); } });
  document.getElementById("exPrev").addEventListener("click", () => { if (exList.length) { exIndex = (exIndex - 1 + exList.length) % exList.length; renderExercises(); } });

  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT") return;
    if (tab === "flashcards") {
      if (e.key === "ArrowRight") fcGo(1);
      else if (e.key === "ArrowLeft") fcGo(-1);
      else if (e.key === " " || e.key === "Enter") { e.preventDefault(); document.getElementById("card").classList.toggle("flipped"); }
    }
  });

  /* ---------- Languages ---------- */
  const TAB_SECTION = { flashcards: "vocabulary", texts: "texts", exercises: "exercises", grammar: "grammar", compare: null, writing: null };

  const langpick = document.getElementById("langpick");
  const langBtn = document.getElementById("langBtn");
  const langMenu = document.getElementById("langMenu");

  function setLangMenu(open) {
    langpick.classList.toggle("open", open);
    langBtn.setAttribute("aria-expanded", open ? "true" : "false");
  }

  function buildLangButtons() {
    langMenu.innerHTML = LANGS.map(l =>
      `<button role="option" aria-selected="false" data-lang="${l.code}">` +
      `<span class="flag">${l.flag || ""}</span><span class="name">${l.name}</span></button>`
    ).join("");
    langMenu.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
      setLangMenu(false);
      selectLang(b.dataset.lang);
    }));
  }

  langBtn.addEventListener("click", () => setLangMenu(!langpick.classList.contains("open")));
  document.addEventListener("click", e => { if (!langpick.contains(e.target)) setLangMenu(false); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") setLangMenu(false); });

  function updateTabs() {
    document.querySelectorAll("#tabs button").forEach(b => {
      const sec = TAB_SECTION[b.dataset.tab];
      const always = b.dataset.tab === "writing" || b.dataset.tab === "compare";
      b.style.display = (always || lang.sections.includes(sec)) ? "" : "none";
    });
  }

  function loadData(code) {
    if (DATA_CACHE[code]) { DATA = DATA_CACHE[code]; return Promise.resolve(); }
    const cfg = LANG_BY_CODE[code];
    const get = (section) => cfg.sections.includes(section)
      ? fetch(`/api/${code}/${section}`).then(r => r.json())
      : Promise.resolve([]);
    return Promise.all([get("vocabulary"), get("texts"), get("exercises"), get("grammar")])
      .then(([words, texts, exercises, grammar]) => {
        DATA = { words, texts, exercises, grammar };
        DATA_CACHE[code] = DATA;
      });
  }

  function selectLang(code) {
    stopSpeech();
    lang = LANG_BY_CODE[code];
    document.getElementById("langBtnFlag").textContent = lang.flag || "";
    document.getElementById("langBtnName").textContent = lang.name;
    langMenu.querySelectorAll("button").forEach(b => {
      const on = b.dataset.lang === code;
      b.classList.toggle("active", on);
      b.setAttribute("aria-selected", on ? "true" : "false");
    });
    document.getElementById("subtitle").textContent =
      `${lang.name} · translations in ${lang.targets.map(t => t.label).join(", ")}`;
    document.getElementById("noteContent").placeholder = `Write in ${lang.name} here…`;
    updateTabs();
    loadData(code).then(() => {
      const keep = tab === "writing" || tab === "compare" || lang.sections.includes(TAB_SECTION[tab]);
      if (!keep) tab = "flashcards";
      applyFilters();
      setTab(tab);
    });
  }

  /* ---------- Init ---------- */
  fetch("/languages").then(r => r.json()).then(langs => {
    LANGS = langs;
    LANG_BY_CODE = Object.fromEntries(langs.map(l => [l.code, l]));
    buildLangButtons();
    const def = langs.find(l => l.default) || langs[0];
    selectLang(def.code);
  }).catch(() => {
    document.getElementById("front").innerHTML = `<div class="word" style="font-size:20px">Could not load data.</div>`;
  });
</script>
</body>
</html>
